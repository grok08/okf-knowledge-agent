<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f5f7">
    <title>InfoMagnus OKF Chat</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <a class="brand" href="/" aria-label="InfoMagnus OKF Chat home">
          <span class="brand-mark" aria-hidden="true">i</span>
          <span>InfoMagnus <span class="brand-muted">Knowledge</span></span>
        </a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark appearance">
          <span class="theme-icon" aria-hidden="true">◐</span>
          <span class="theme-label">Dark</span>
        </button>
      </header>

      <section class="chat-layout" aria-label="Knowledge chat">
        <div class="conversation" id="conversation" aria-live="polite" aria-relevant="additions text">
          <section class="welcome" id="welcome">
            <div class="welcome-icon" aria-hidden="true">✳</div>
            <p class="eyebrow">Your knowledge assistant</p>
            <h1>What would you like to know?</h1>
            <p class="welcome-copy">Ask a question about InfoMagnus. Answers come from the local knowledge base, with sources you can check.</p>
            <div class="suggestions" aria-label="Example questions">
              <button class="suggestion" type="button">What services does InfoMagnus offer?</button>
              <button class="suggestion" type="button">How does InfoMagnus help with modernization?</button>
            </div>
          </section>
          <div class="turn-list" id="turn-list"></div>
        </div>

        <form class="composer" id="composer">
          <label class="visually-hidden" for="question">Your question</label>
          <input id="question" name="question" type="text" maxlength="4000" autocomplete="off" placeholder="Ask anything about InfoMagnus..." required>
          <div class="composer-footer">
            <span class="composer-hint">Press Enter to send</span>
            <button class="send-button" id="send" type="submit">
              <span>Send</span><span aria-hidden="true">↑</span>
            </button>
          </div>
          <p class="composer-error" id="composer-error" role="alert" hidden></p>
        </form>
        <p class="privacy-note">Your conversation stays in this tab and is cleared when you leave.</p>
      </section>
    </main>
  </body>
</html>

name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "agent/web/**"
      - "agent/src/build-pages.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require the Worker URL
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: test -n "$PUBLIC_API_BASE"
      - name: Build Pages site
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
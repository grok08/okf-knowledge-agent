name: Deploy Worker

on:
  push:
    branches: [master]
    paths:
      - "agent/prompts/**"
      - "agent/src/agent.ts"
      - "agent/src/build-catalog.ts"
      - "agent/src/catalog-export.ts"
      - "agent/src/catalog.ts"
      - "agent/src/completion.ts"
      - "agent/src/core-agent.ts"
      - "agent/src/groq.ts"
      - "agent/src/types.ts"
      - "agent/src/worker.ts"
      - "okf/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:catalog
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.145.0"
          command: deploy